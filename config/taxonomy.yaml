      - '\blegal\b'
      - '\b(?:accountant|comptable|accounting)\b'
      - '\bcustomer success\b'
      - '\bpayroll\b'
    description_min_hits: 3
  language:
    accepted: [fr, en]
    sample_chars: 1500
    min_words: 12
    margin: 1.5
    stopwords:
      en: [the, and, with, you, will, our, are, your, we, of, to, for, team, skills, have, this, that, work]
      fr: [le, les, des, du, et, pour, vous, nous, avec, dans, une, est, votre, notre, au, aux, que, sur]
      nl: [het, een, van, voor, met, wij, jij, je, onze, ervaring, bij, naar, zijn, kennis, wordt, ook, bent, als]
      de: [der, die, das, und, mit, für, wir, sie, eine, ist, von, zu, erfahrung, im, den, dem, auf]
  freshness:
    max_age_days: 30        # aggregators (Actiris, Adzuna): older listings are often filled
    ats_max_age_days: 120   # company boards list only open roles

languages:
  - en
  - fr
  - nl
  - de

# Keyword searches for Actiris and Adzuna. Both match every word, so short, broad terms find
# more; the filters then keep the junior, Brussels, AI/data postings. Override in local/taxonomy.yaml.
