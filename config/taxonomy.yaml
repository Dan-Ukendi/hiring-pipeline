filters:
  geography:
    postal_min: 1000
    postal_max: 1212
    foreign_country_markers:
      - switzerland
      - suisse
      - schweiz
      - france
      - frankrijk
      - netherlands
      - nederland
      - pays-bas
      - germany
      - deutschland
      - allemagne
      - luxembourg
      - united kingdom
      - spain
      - italy
      - portugal
      - poland
      - united states
    remote_markers:
      - remote
      - télétravail
      - teletravail
      - home office
      - homeoffice
      - work from home
      - thuiswerk
      - telewerk
  seniority:
    experience_patterns:
      - '(?P<low>\d{1,2})\s*(?:(?:-|–|to|à|tot|bis)\s*(?P<high>\d{1,2}))?\s*\+?\s*(?:years?|yrs?|ans?|jaar|jaren|jahre)\b[^.\n;]{0,40}?(?:experience|expérience|ervaring|erfahrung)'
      - '(?:experience|expérience|ervaring|erfahrung)[^.\n;\d]{0,40}?(?P<low>\d{1,2})\s*(?:(?:-|–|to|à|tot|bis)\s*(?P<high>\d{1,2}))?\s*\+?\s*(?:years?|yrs?|ans?|jaar|jaren|jahre)\b'
    desirable_markers:
      - nice to have
      - is a plus
      - a plus
      - preferred
      - desirable
      - ideally
      - an asset
      - souhaité
      - souhaitée
      - un plus
      - atout
      - idéalement
      - de préférence
      - bij voorkeur
      - een pluspunt
      - idealiter
      - is een plus
      - voorkeur
      - wenselijk
      - gewenst
      - souhaitable
      - préférable
      - préféré
    no_experience_markers:
      - no experience required
      - no prior experience
      - no previous experience
      - without experience
      - sans expérience
      - aucune expérience
      - expérience non requise
      - geen ervaring
      - zonder ervaring
      - ervaring is niet vereist
    fail_floor_years: 3
    borderline_floor_years: 1
  domain:
    adjacent_terms:
      - data analyst
      - data analytics
      - analytics
      - business intelligence
      - bi developer
      - big data
      - data lake
      - lakehouse
      - data science
      - neural network
      - recommender
      - pytorch
      - tensorflow
      - scikit-learn
      - research scientist
      - data steward
      - data quality
      - data governance
    hard_exclude_title:
      - '\b(?:sales|account (?:executive|manager)|business development|bdr|sdr|recruiter|recruitment|talent acquisition|sourcer)\b'
    soft_exclude_title:
      - '\bbusiness analyst\b'
      - '\bfunctional analyst\b'
      - '\banalyste (?:métier|fonctionnel)\b'
      - '\bbedrijfsanalist\b'
      - '\breporting\b'
      - '\bmarketing\b'
      - '\b(?:human resources|hr)\b'
      - '\blegal\b'
      - '\b(?:accountant|comptable|accounting)\b'
      - '\bcustomer success\b'
      - '\bpayroll\b'
    description_min_hits: 3
  language:
    accepted: [fr, en]
    sample_chars: 1500
    min_words: 12
    margin: 1.5
    stopwords:
      en: [the, and, with, you, will, our, are, your, we, of, to, for, team, skills, have, this, that, work]
      fr: [le, les, des, du, et, pour, vous, nous, avec, dans, une, est, votre, notre, au, aux, que, sur]
      nl: [het, een, van, voor, met, wij, jij, je, onze, ervaring, bij, naar, zijn, kennis, wordt, ook, bent, als]
      de: [der, die, das, und, mit, für, wir, sie, eine, ist, von, zu, erfahrung, im, den, dem, auf]
  freshness:
    max_age_days: 30

