[[vendor]]
name = "greenhouse"
kind = "hosted_form"
patterns = [
  '^(?:job-boards|boards)(?:\.eu)?\.greenhouse\.io/(?P<tenant>[^/]+)/jobs/(?P<external_id>\d+)',
  '^(?:job-boards|boards)(?:\.eu)?\.greenhouse\.io/embed/job_app\?.*for=(?P<tenant>[^&]+)&.*token=(?P<external_id>\d+)',
]

[[vendor]]
name = "lever"
kind = "hosted_form"
patterns = ['^jobs(?:\.eu)?\.lever\.co/(?P<tenant>[^/]+)/(?P<external_id>[0-9a-f-]{36})']

[[vendor]]
name = "ashby"
kind = "hosted_form"
patterns = ['^jobs\.ashbyhq\.com/(?P<tenant>[^/]+)/(?P<external_id>[0-9a-f-]{36})']

[[vendor]]
name = "workable"
kind = "hosted_form"
patterns = ['^apply\.workable\.com/(?P<tenant>[^/]+)/j/(?P<external_id>[A-Za-z0-9]+)']

[[vendor]]
name = "smartrecruiters"
kind = "hosted_form"
patterns = ['^(?:jobs|careers)\.smartrecruiters\.com/(?P<tenant>[^/]+)/(?P<external_id>\d+)']

[[vendor]]
name = "recruitee"
kind = "hosted_form"
